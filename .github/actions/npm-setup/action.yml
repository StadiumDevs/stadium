name: npm setup
description: Node 24 + pinned npm (+ optional npm ci) for client/ or server/. Run after actions/checkout.

inputs:
  dir:
    description: client or server
    required: true
  install:
    description: Run `npm ci` in the directory
    default: "true"
  ignore-scripts:
    description: Pass --ignore-scripts to npm ci
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: ${{ inputs.dir }}/package-lock.json

    # client/package-lock.json was written by npm 11.6.2; server/package-lock.json was
    # re-locked with npm 10 (#236) and is accepted by both npm 10 and 11.6.2. The npm
    # bundled with Node 24 on runners (11.19) rejects them in `npm ci` (optional peer
    # deps are recorded differently), so pin 11.6.2. Bump together with a relock of
    # both lockfiles. Single source of truth.
    - name: Pin npm
      shell: bash
      run: npm install -g npm@11.6.2

    - name: npm ci
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: npm ci ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
