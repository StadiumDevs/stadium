name: Server tests

# Runs the server Vitest suite on pull requests. It includes the parity tests
# (normalization-parity.test.js, program-stats-parity.test.js), which check the
# client playground's copies of the score normalization and the stats page
# against the server's, so they can't drift apart.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'server/**'
      - 'client/src/lib/scoreNormalization.ts'
      - 'client/src/lib/programStats.ts'
      - 'client/src/lib/programStatsConfig.ts'
      - 'client/src/lib/experienceRatings.ts'
      - '.github/workflows/server-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
