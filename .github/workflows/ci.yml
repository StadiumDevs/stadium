name: CI

# Same checks as /pre-pr-check: server tests, client typecheck+build, client lint.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

env:
  # Lockfiles were written by npm 11.6.2. Newer npm (11.19, bundled with Node 24
  # on runners) rejects them in `npm ci` (optional peer deps are recorded differently).
  # Bump together with a relock.
  NPM_VERSION: 11.6.2

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Pin npm to the version that wrote the lockfiles
        run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Pin npm to the version that wrote the lockfiles
        run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run build
      - run: npm run lint
