# Dependabot version updates. Security updates (PRs for open advisories) are a
# separate repo setting: Settings → Code security → Dependabot security updates.
#
# npm (client + server together) is checked once a day at the END of the day
# (23:00 Europe/Berlin), and every bump (major, minor and patch, across both
# apps) lands in ONE grouped PR, to keep PR volume down. Security updates fire as
# soon as an advisory appears, independent of the schedule, and are grouped into
# one PR as well.
#
# Trade-off: a breaking major in the batch blocks the whole PR until it's fixed.
# If one package keeps doing that, add an `ignore` entry for its majors here.
#
# PRs target `develop` and, like every PR here, need a CODEOWNER to merge.
version: 2
updates:
  - package-ecosystem: npm
    # With `directories`, each group is a single PR across both apps.
    directories:
      - /client
      - /server
    target-branch: develop
    schedule:
      interval: daily
      time: "23:00"
      timezone: Europe/Berlin
    # The daily batch plus, at most, one grouped security PR.
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
