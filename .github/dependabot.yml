# Dependabot version updates. Security updates (PRs for open advisories) are a
# separate repo setting: Settings → Code security → Dependabot security updates.
#
# npm (client + server together) is checked once a day at the END of the day
# (23:00 Europe/Berlin), and every minor and patch bump across both apps lands in
# ONE grouped PR. Security updates fire as soon as an advisory appears,
# independent of the schedule, and are grouped into one PR as well.
#
# MAJOR versions are ignored on purpose. Majors such as React 19, Tailwind 4,
# Vite 8 and TypeScript 7 are migrations, not drop-in bumps; bundling them
# produced an uninstallable PR (#282). Upgrade a major deliberately, in its own
# PR, when planned. The ignore also suppresses a security fix that only exists in
# a new major; the CI `audit` jobs still flag those advisories.
#
# PRs target `develop` and, like every PR here, need a CODEOWNER to merge.
version: 2
updates:
  - package-ecosystem: npm
    # With `directories`, each group is a single PR across both apps.
    directories:
      - /client
      - /server
    target-branch: develop
    schedule:
      interval: daily
      time: "23:00"
      timezone: Europe/Berlin
    # The daily batch plus, at most, one grouped security PR.
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Majors are upgraded by hand (see the header).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
