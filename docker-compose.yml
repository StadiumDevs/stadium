# Run the API server in a container, configured from server/.env (Supabase).
#   cp server/.env.example server/.env   # fill in SUPABASE_URL etc.
#   docker compose up --build
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: blockspace-server
    restart: unless-stopped
    ports:
      - "2000:2000"
    env_file:
      - ./server/.env
    environment:
      - PORT=2000
